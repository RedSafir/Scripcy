[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scrpcy"
version = "0.1.0"
description = "A local-first academic research studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "pyyaml>=6.0",
    "google-genai>=0.1.0",
    "litellm>=1.0.0",
    "httpx>=0.25.0",
    "python-docx>=1.0.0",
    "typer>=0.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
    "pyalex>=0.21.0",
    "markitdown[all]>=0.1.0",
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.0.0",
]

[project.scripts]
scrpcy = "scrpcy.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["scrpcy*"]
